name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 UTC
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job_o_matic

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart pub audit
        run: dart pub audit || echo "Audit completed with warnings"

      - name: Run osv-scanner
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          base-ref: ${{ github.base_ref }}
          head-ref: ${{ github.head_ref }}

      - name: Check for known vulnerabilities
        id: vuln_check
        run: |
          echo "::notice::Security scan completed"
          dart analyze --fatal-infos lib/

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            job_o_matic/pubspec.lock
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript  # Dart/Flutter analysis via CodeQL JS
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4