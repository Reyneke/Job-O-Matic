name: Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: job_o_matic

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            job_o_matic/.dart_tool
            job_o_matic/.packages
            job_o_matic/pubspec.lock
          key: ${{ runner.os }}-pub-${{ hashFiles('job_o_matic/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart Code Metrics (if available)
        continue-on-error: true
        run: |
          dart analyze lib/ --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: job_o_matic/coverage/lcov.info
          retention-days: 7

      - name: Check code coverage threshold
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage report found. Threshold: 60% (Phase 1)"
          else
            echo "No coverage report generated."
          fi