name: job_o_matic
description: "Job-O-Matic – Automatisierte Bewerbungserstellung"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  logging: ^1.2.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  http: ^1.2.0
  share_plus: ^10.0.0
  path: ^1.9.0
  google_fonts: ^6.2.0
  yaml: ^3.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  flutter_secure_storage: ^9.0.0
  pdf: ^3.10.0
  printing: ^5.12.0
  html: ^0.15.4
  connectivity_plus: ^6.0.0
  mustache_template: ^2.0.0
  uuid: ^4.0.0
  pdf_combiner: ^6.2.1

# Pin sqlite3 auf 2.x: sqflite_common_ffi 2.3.5 erlaubt zwar sqlite3 ^3.0,
# importiert aber weiterhin package:sqlite3/open.dart, das es in sqlite3 3.x
# nicht mehr gibt (Breaking Change) → Build/Compile-Fehler.
dependency_overrides:
  sqlite3: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/theme/
    - assets/mydata/cv/
    - assets/mydata/cv/certificates/
    - assets/mydata/vorlagen/